name: Update Cloudflare DMARC

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - cloudflare/dmarc-record.txt
      - .github/workflows/update-cloudflare-dmarc.yml

jobs:
  update-dmarc:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      DOMAIN_NAME: bkparfume.site
      RECORD_NAME: _dmarc.bkparfume.site

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set"
            exit 1
          fi

      - name: Read DMARC policy from repository
        id: read_policy
        run: |
          record_content=$(tr -d '\r' < cloudflare/dmarc-record.txt | sed 's/[[:space:]]*$//')

          if [ -z "$record_content" ]; then
            echo "cloudflare/dmarc-record.txt is empty"
            exit 1
          fi

          echo "record_content=$record_content" >> "$GITHUB_OUTPUT"

      - name: Upsert DMARC TXT record
        env:
          RECORD_CONTENT: ${{ steps.read_policy.outputs.record_content }}
        run: |
          set -euo pipefail

          call_cloudflare() {
            local method="$1"
            local url="$2"
            local payload="${3:-}"
            local response

            if [ -n "$payload" ]; then
              response=$(curl -sS -X "$method" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$payload" \
                "$url")
            else
              response=$(curl -sS -X "$method" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                "$url")
            fi

            printf '%s' "$response" | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => { const json = JSON.parse(data); if (!json.success) { const errors = (json.errors || []).map(item => item.message || JSON.stringify(item)).join('; '); console.error(errors || 'Cloudflare API request failed'); process.exit(1); } process.stdout.write(JSON.stringify(json)); });"
          }

          zone_id="$CLOUDFLARE_ZONE_ID"

          if [ -z "$zone_id" ]; then
            zone_response=$(call_cloudflare GET "https://api.cloudflare.com/client/v4/zones?name=$DOMAIN_NAME&status=active")

            zone_id=$(printf '%s' "$zone_response" | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => { const json = JSON.parse(data); const zone = json.result?.[0]; if (!zone?.id) { console.error('Cloudflare zone lookup returned no active zone. Add CLOUDFLARE_ZONE_ID secret or grant Zone:Read.'); process.exit(1); } process.stdout.write(zone.id); });")
          fi

          record_response=$(call_cloudflare GET "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?type=TXT&name=$RECORD_NAME")

          record_id=$(printf '%s' "$record_response" | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => { const json = JSON.parse(data); const record = json.result?.[0]; process.stdout.write(record?.id || ''); });")

          payload=$(node -e "const payload = { type: 'TXT', name: process.env.RECORD_NAME, content: process.env.RECORD_CONTENT, ttl: 1 }; process.stdout.write(JSON.stringify(payload));")

          if [ -n "$record_id" ]; then
            call_cloudflare PUT "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records/$record_id" "$payload" > /dev/null
          else
            call_cloudflare POST "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records" "$payload" > /dev/null
          fi

      - name: Publish summary
        if: always()
        env:
          RECORD_CONTENT: ${{ steps.read_policy.outputs.record_content }}
        run: |
          echo "## Cloudflare DMARC" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Record: $RECORD_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Value: $RECORD_CONTENT" >> "$GITHUB_STEP_SUMMARY"