name: Update DMARC DNS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - cloudflare/dmarc-record.txt
      - .github/workflows/update-cloudflare-dmarc.yml

jobs:
  update-dmarc:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DOMAIN_NAME: bkparfume.site
      RECORD_NAME: _dmarc.bkparfume.site
      CPANEL_API_HOST: ${{ secrets.CPANEL_HOST || secrets.DEPLOY_HOST || secrets.FTP_HOST }}
      CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME || secrets.CPANEL_USER || secrets.DEPLOY_USERNAME || secrets.FTP_USERNAME }}
      CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD || secrets.DEPLOY_PASSWORD || secrets.FTP_PASSWORD }}
      CPANEL_PORT: ${{ secrets.CPANEL_PORT || '2083' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate cPanel secrets
        run: |
          if [ -z "$CPANEL_API_HOST" ]; then
            echo "cPanel host secret is not set"
            exit 1
          fi

          if [ -z "$CPANEL_USERNAME" ]; then
            echo "cPanel username secret is not set"
            exit 1
          fi

          if [ -z "$CPANEL_PASSWORD" ]; then
            echo "cPanel password secret is not set"
            exit 1
          fi

      - name: Read DMARC policy from repository
        id: read_policy
        run: |
          record_content=$(tr -d '\r' < cloudflare/dmarc-record.txt | sed 's/[[:space:]]*$//')

          if [ -z "$record_content" ]; then
            echo "cloudflare/dmarc-record.txt is empty"
            exit 1
          fi

          echo "record_content=$record_content" >> "$GITHUB_OUTPUT"

      - name: Upsert DMARC TXT record
        env:
          RECORD_CONTENT: ${{ steps.read_policy.outputs.record_content }}
        run: |
          set -euo pipefail

          call_cpanel() {
            local function_name="$1"
            shift
            local response

            response=$(curl -sS --fail-with-body -u "$CPANEL_USERNAME:$CPANEL_PASSWORD" \
              --get "https://$CPANEL_API_HOST:$CPANEL_PORT/json-api/cpanel" \
              --data-urlencode "cpanel_jsonapi_user=$CPANEL_USERNAME" \
              --data-urlencode "cpanel_jsonapi_apiversion=2" \
              --data-urlencode "cpanel_jsonapi_module=ZoneEdit" \
              --data-urlencode "cpanel_jsonapi_func=$function_name" \
              "$@")

            printf '%s' "$response" | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => { const json = JSON.parse(data); const result = json.cpanelresult?.event?.result; if (result !== 1) { const errors = [ ...(json.cpanelresult?.error ? [json.cpanelresult.error] : []), ...(json.cpanelresult?.data || []).flatMap(item => item?.statusmsg ? [item.statusmsg] : []), ...(json.error ? [json.error] : []) ].filter(Boolean).join('; '); console.error(errors || 'cPanel API2 ZoneEdit request failed'); process.exit(1); } process.stdout.write(JSON.stringify(json)); });"
          }

          record_response=$(call_cpanel fetchzone_records \
            --data-urlencode "domain=$DOMAIN_NAME" \
            --data-urlencode "name=$RECORD_NAME" \
            --data-urlencode "type=TXT")

          record_line=$(printf '%s' "$record_response" | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => { const json = JSON.parse(data); const records = json.cpanelresult?.data || []; const record = records.find(item => (item.name === process.env.RECORD_NAME || item.name === process.env.RECORD_NAME.replace(/\.$/, '')) && item.type === 'TXT'); process.stdout.write(record?.line ? String(record.line) : ''); });")

          if [ -n "$record_line" ]; then
            call_cpanel edit_zone_record \
              --data-urlencode "domain=$DOMAIN_NAME" \
              --data-urlencode "line=$record_line" \
              --data-urlencode "name=$RECORD_NAME" \
              --data-urlencode "type=TXT" \
              --data-urlencode "ttl=14400" \
              --data-urlencode "txtdata=$RECORD_CONTENT" > /dev/null
          else
            call_cpanel add_zone_record \
              --data-urlencode "domain=$DOMAIN_NAME" \
              --data-urlencode "name=$RECORD_NAME" \
              --data-urlencode "type=TXT" \
              --data-urlencode "ttl=14400" \
              --data-urlencode "txtdata=$RECORD_CONTENT" > /dev/null
          fi

      - name: Publish summary
        if: always()
        env:
          RECORD_CONTENT: ${{ steps.read_policy.outputs.record_content }}
        run: |
          echo "## DMARC DNS" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Record: $RECORD_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Value: $RECORD_CONTENT" >> "$GITHUB_STEP_SUMMARY"
